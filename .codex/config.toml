[mcp_servers.metals]
# Coursier (cs) and Git must be available on Codex's PATH.
# Resolve the checkout at launch time, including when Codex starts in a subdirectory.
command = "sh"
args = ["-c", 'workspace=$(git rev-parse --show-toplevel) && exec cs launch org.scalameta:metals-mcp_2.13:1.6.9 -- --workspace "$workspace" --transport stdio']
startup_timeout_sec = 180
tool_timeout_sec = 600
