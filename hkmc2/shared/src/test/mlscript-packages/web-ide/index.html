<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- HTML Meta Tags -->
    <title>MLscript Web IDE</title>
    <meta name="description" content="" />
    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://mlscript.fun" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MLscript Web IDE" />
    <meta property="og:description" content="A simple web IDE for MLscript, made by HKUST TACO." />
    <meta property="og:image" content="" />
    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="mlscript.fun" />
    <meta property="twitter:url" content="https://mlscript.fun" />
    <meta name="twitter:title" content="MLscript Web IDE" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="" />

    <!-- Radix Colors from CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@latest/sand.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@latest/sand-dark.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@latest/red.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@radix-ui/colors@latest/red-dark.css"
    />

    <!-- Google Fonts - Variable Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lucide-static@0.556.0/font/lucide.css"
    />

    <link rel="stylesheet" href="./style.css?v=ui-pass-002" />

    <!-- Each of the following files registers a custom element. -->
    <script type="module" src="./components/ResizeHandle.mjs"></script>
    <script type="module" src="./components/TreeNode.mjs"></script>
    <script type="module" src="./components/FileExplorer.mjs"></script>
    <script type="module" src="./components/EditorPanel.mjs"></script>
    <script type="module" src="./components/ReservedPanel.mjs"></script>
    <script type="module" src="./components/ToolbarPanel.mjs"></script>
    <script type="module" src="./components/ConsolePanel.mjs"></script>
  </head>

  <body>
    <div class="app-layout">
      <toolbar-panel class="toolbar"></toolbar-panel>
      <div class="app-container">
        <aside class="activity-rail activity-rail-left" aria-label="Left sidebar">
          <button class="activity-button active" data-sidebar-side="left" data-sidebar-panel="files" aria-label="Files" aria-pressed="true" title="Files">
            <i class="icon-files"></i>
          </button>
          <button class="activity-button" data-sidebar-side="left" data-sidebar-panel="version-control" aria-label="Version Control" aria-pressed="false" title="Version Control">
            <i class="icon-git-branch"></i>
          </button>
        </aside>
        <file-explorer class="sidebar-panel left-sidebar-panel active" data-sidebar-side="left" data-sidebar-panel="files"></file-explorer>
        <section class="sidebar-placeholder sidebar-panel left-sidebar-panel" data-sidebar-side="left" data-sidebar-panel="version-control" aria-label="Version Control">
          <div class="sidebar-placeholder-header">Version Control</div>
          <div class="sidebar-placeholder-content">
            <i class="icon-git-branch"></i>
            <span>No repository status</span>
          </div>
        </section>
        <editor-panel class="editor"></editor-panel>
        <reserved-panel class="sidebar-panel right-sidebar-panel active" data-sidebar-side="right" data-sidebar-panel="diagnostics"></reserved-panel>
        <section class="sidebar-placeholder sidebar-panel right-sidebar-panel" data-sidebar-side="right" data-sidebar-panel="compiler-logs" aria-label="Compiler Logs">
          <div class="sidebar-placeholder-header">Compiler Logs</div>
          <div class="sidebar-placeholder-content">
            <i class="icon-scroll-text"></i>
            <span>No compiler logs</span>
          </div>
        </section>
        <aside class="activity-rail activity-rail-right" aria-label="Right sidebar">
          <button class="activity-button active" data-sidebar-side="right" data-sidebar-panel="diagnostics" aria-label="Diagnostics" aria-pressed="true" title="Diagnostics">
            <i class="icon-circle-alert"></i>
          </button>
          <button class="activity-button" data-sidebar-side="right" data-sidebar-panel="compiler-logs" aria-label="Compiler Logs" aria-pressed="false" title="Compiler Logs">
            <i class="icon-scroll-text"></i>
          </button>
        </aside>
      </div>
      <console-panel class="console"></console-panel>
    </div>

    <!-- Rewrite paths to MLscript libraries. -->
    <script type="importmap">
      {
        "imports": {
          "./Runtime.mjs": "./mlscript-std/Runtime.mjs",
          "./Rendering.mjs": "./mlscript-std/Rendering.mjs",
          "./RuntimeJS.mjs": "./mlscript-std/RuntimeJS.mjs",
          "./Iter.mjs": "./mlscript-std/Iter.mjs",
          "./LazyArray.mjs": "./mlscript-std/LazyArray.mjs"
        }
      }
    </script>

    <script type="module" src="./main.mjs"></script>
  </body>
</html>
