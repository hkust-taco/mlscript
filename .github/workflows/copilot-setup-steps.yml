name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # - name: Install native toolchain dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y clang g++ make libboost-all-dev libgmp-dev libmimalloc-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Show tool versions
        run: |
          java -version
          node --version
          npm --version
          sbt --script-version
